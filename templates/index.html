<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BizMiner - Business Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #loading {
            z-index: 9999;
        }

        #loading-text {
            font-size: 1.2rem;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">BizMiner Scraper</h2>
            </div>
            <div class="card-body">
                <form method="post" action="/">
                    <div class="mb-3">
                        <label class="form-label">Business Category</label>
                        <input type="text" class="form-control" name="category" placeholder="e.g. salon" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" name="location" placeholder="e.g. Kolkata" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Scrape Google Maps</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="d-none position-fixed top-0 start-0 w-100 h-100 bg-white bg-opacity-75 d-flex flex-column justify-content-center align-items-center">
        <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;"></div>
        <p class="mt-3 text-primary" id="loading-text">Scraping businesses from Google Maps</p>
    </div>

    <script>
        document.querySelector("form").addEventListener("submit", function () {
            document.getElementById("loading").classList.remove("d-none");

            // Animate ellipsis in loading text
            let text = document.getElementById("loading-text");
            let baseText = "Scraping businesses from Google Maps";
            let dots = 0;
            setInterval(() => {
                dots = (dots + 1) % 4;
                text.textContent = baseText + ".".repeat(dots);
            }, 500);
        });
    </script>
</body>
</html>
