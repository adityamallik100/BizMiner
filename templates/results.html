<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BizMiner Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Scraped Businesses</h3>
            <a href="/download" class="btn btn-success">Download CSV</a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover bg-white">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Phone</th>
                        <th>Website</th>
                        <th>Email</th>
                        <th>Source</th>
                    </tr>
                </thead>
                <tbody>
                    {% for lead in leads %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ lead.business_name }}</td>
                        <td>{{ lead.address }}</td>
                        <td>{{ lead.phone }}</td>
                        <td>
                            {% if lead.website %}
                                <a href="{{ lead.website }}" target="_blank">Visit</a>
                            {% else %}
                                —
                            {% endif %}
                        </td>
                        <td>{{ lead.email or '—' }}</td>
                        <td>{{ lead.source }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <a href="/" class="btn btn-secondary mt-3">← Scrape Again</a>
    </div>
</body>
</html>
